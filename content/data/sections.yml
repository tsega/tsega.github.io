# Section heads: the gold eyebrow, the h2 and the "Sheet" label on the right.
# Community sets its h2 in community.yml, below the rule.
about:
  eyebrow: 01 — About
  heading: Architect, engineer, organizer.
  sheet: Sheet A-01
writing:
  eyebrow: 02 — Writing
  heading: Notes from the drawing board.
  sheet: Sheet A-02
  readMore: Read the post
  # Shown in place of the posts until the first one is published.
  empty: First posts coming soon.
  # Points at the RSS feed until the newsletter (#25) brings email back.
  subscribe:
    text: Follow new posts by RSS
    label: Subscribe
    href: /rss.xml
work:
  eyebrow: 03 — Work
  heading: Systems, not just sites.
  sheet: Sheet A-03
community:
  eyebrow: 04 — Community
  sheet: Sheet A-04
skills:
  eyebrow: 05 — Skills
  heading: Skills, and the projects that used them.
  sheet: Sheet A-05
experience:
  eyebrow: 06 — Experience
  heading: One thread, branching wide.
  sheet: Sheet A-06
# The error page (app/error.vue). `notFound` is the 404 that GitHub Pages
# serves for unknown paths; `other` covers anything else that goes wrong.
error:
  notFound:
    eyebrow: 404 — Sheet missing
    heading: This sheet isn't in the set.
    sheet: Sheet X-404
    title: Page not found
    text: The page may have moved, or the link may be mistyped. Start again from the homepage, or browse the writing.
  other:
    eyebrow: Error — Sheet damaged
    heading: Something went wrong on this sheet.
    sheet: Sheet X-500
    title: Something went wrong
    text: The page couldn't be drawn. Try again in a moment, or start again from the homepage.
  home: Back to the homepage
  blog: or read the writing
# The /blog index page. `title` and `description` go in the page head.
blog:
  eyebrow: Writing — All posts
  heading: Notes from the drawing board.
  sheet: Sheet B-01
  title: Writing
  # Placeholder: Tsega to confirm or replace.
  description: Posts by Tsegaselassie Tadesse, notes from the drawing board.
  empty: First posts coming soon.
  # Labels on each post page. `minutes` follows the number: "4 min read".
  post:
    back: All posts
    minutes: min read
    newer: Newer post
    older: Older post
    tags: Tags
