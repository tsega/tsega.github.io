<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder until a real photo of the city at night is available. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b10"/>
      <stop offset="1" stop-color="#3a2716"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#3a2c1c" stroke-width="1"/>
    </pattern>
    <pattern id="windows" width="24" height="30" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="8" height="10" fill="#e0982b" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#night)"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <g fill="#1b1109">
    <rect x="40" y="380" width="130" height="320"/>
    <rect x="190" y="260" width="110" height="440"/>
    <rect x="320" y="330" width="150" height="370"/>
    <rect x="490" y="180" width="120" height="520"/>
    <rect x="630" y="300" width="140" height="400"/>
    <rect x="790" y="230" width="100" height="470"/>
    <rect x="910" y="350" width="140" height="350"/>
    <rect x="1070" y="290" width="110" height="410"/>
  </g>
  <g fill="url(#windows)">
    <rect x="190" y="290" width="110" height="410"/>
    <rect x="490" y="210" width="120" height="490"/>
    <rect x="790" y="260" width="100" height="440"/>
    <rect x="1070" y="320" width="110" height="380"/>
  </g>
  <rect y="640" width="1200" height="60" fill="#1b1109"/>
</svg>
